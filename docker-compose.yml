services:
  postgres:
    image: postgres:16-alpine
    container_name: clube04-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clube04_crm}
      POSTGRES_USER: ${POSTGRES_USER:-clube04}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clube04_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clube04} -d ${POSTGRES_DB:-clube04_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clube04-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clube04-crm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crm-worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: clube04-crm-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crm-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: clube04-crm-web
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    command: ["npm", "run", "dev", "-w", "@clube04/web", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_workspace_node_modules:/app/apps/web/node_modules

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.22.4}
    container_name: clube04-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/Sao_Paulo}
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_MCP_MANAGED_BY_ENV: "false"
      N8N_MCP_ACCESS_ENABLED: "false"
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin_local_only}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
    depends_on:
      crm-api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  web_node_modules:
  web_workspace_node_modules:
